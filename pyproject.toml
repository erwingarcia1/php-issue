[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minas-ai-website-auditor"
version = "1.0.0"
description = "Evidence-first, nonintrusive public website auditor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.150,<3", "google-auth>=2.35,<3"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
minas-audit = "minas_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["minas_auditor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

